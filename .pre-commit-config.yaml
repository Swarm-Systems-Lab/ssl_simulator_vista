repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.pyi$'
      - id: end-of-file-fixer
        exclude: '\.pyi$'
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: no-local-uv-sources
        name: no local uv path sources (pyproject.toml / uv.lock)
        entry: python3 scripts/check_no_local_sources.py
        language: pygrep
        files: '^(pyproject\.toml|uv\.lock)$'
        entry: '(?:^\s*path\s*=\s*"|source\s*=\s*\{\s*(?:editable|directory|path)\s*=\s*"(?!\."))'